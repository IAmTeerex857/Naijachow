      rel="stylesheet"
    />
    <script>
      /* Set the theme before first paint. Without this the page renders the
         dark default and then flips, which reads as a flash on every load.
         useTheme.js reads the same key and keeps it in sync afterwards. */
      ;(function () {
        try {
          var saved = localStorage.getItem('np-theme')
          var theme =
            saved ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
