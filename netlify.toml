[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
# ⚠️ Do NOT add `timeout = 26` here — that is invalid syntax under [functions]
# and breaks every deploy ("functions.timeout must be an object"). The default
# 10s timeout is fine with Claude Haiku.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
